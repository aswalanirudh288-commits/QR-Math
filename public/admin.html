<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Feedback dashboard</title>
<style>
:root{--bg:#f7f8f4;--ink:#101418;--card:#fff;--blue:#2f5bff;--star:#f5a623;--mute:#566070}
@media(prefers-color-scheme:dark){:root{--bg:#0f1319;--ink:#eef1f6;--card:#171d27;--mute:#9aa6b8;--blue:#7b98ff}}
*{box-sizing:border-box}body{margin:0;font:1rem/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:20px;max-width:760px;margin:0 auto}
h1{font-size:1.7rem;margin:0 0 16px}.card{background:var(--card);border:2px solid var(--ink);padding:16px;margin-bottom:14px}
input,button{font:inherit;padding:12px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);width:100%;border-radius:0}
button{background:var(--blue);color:#fff;margin-top:10px;cursor:pointer}
.top{display:flex;gap:24px;flex-wrap:wrap}.top b{display:block;font-size:2.4rem;line-height:1}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}.bar span:first-child{width:28px}.bar div{flex:1;background:#8883;height:16px}.bar i{display:block;height:100%;background:var(--star)}
.item{border-top:1px solid #8886;padding:10px 0}.item:first-child{border:0}.s{color:var(--star)}.m{font-size:.85rem;color:var(--mute)}
.err{color:#d6322f}
</style></head><body>
<h1>Feedback dashboard</h1>
<div class="card" id="login"><label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password"><button id="go">Open dashboard</button><div class="err" id="err"></div></div>
<div id="dash" hidden>
  <div class="card top"><div><b id="avg"></b>average</div><div><b id="tot"></b>responses</div></div>
  <div class="card"><b>Rating distribution</b><div id="dist"></div></div>
  <div class="card"><b>All responses</b><div id="list"></div></div>
</div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  const r=await fetch('/api/admin/feedback',{headers:{'x-admin-password':$('pw').value}});
  if(!r.ok){$('err').textContent='Wrong password.';return}
  const d=await r.json();$('login').hidden=true;$('dash').hidden=false;
  $('avg').textContent=d.count?d.average.toFixed(1)+' ★':'–';$('tot').textContent=d.count;
  $('dist').innerHTML=[5,4,3,2,1].map(n=>`<div class="bar"><span>${n}★</span><div><i style="width:${d.count?d.distribution[n]/d.count*100:0}%"></i></div><span>${d.distribution[n]}</span></div>`).join('');
  $('list').innerHTML=d.items.length?d.items.map(i=>`<div class="item"><span class="s">${'★'.repeat(i.stars)}</span> <b>${esc(i.name)||'Anonymous'}</b>${i.comment?`<div>${esc(i.comment)}</div>`:''}<div class="m">${new Date(i.created_at).toLocaleString()}</div></div>`).join(''):'<p>No responses yet.</p>';
}
$('go').onclick=load;$('pw').addEventListener('keydown',e=>e.key==='Enter'&&load());
</script></body></html>
